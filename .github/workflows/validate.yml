name: Validate meta repository

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ecosystem repositories
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate repository documentation
        shell: bash
        run: |
          set -euo pipefail

          test -s README.md
          test -s CHATGPT.md
          test -s docs/architecture.md
          test -s docs/repository-map.md
          test -s docs/build-model.md
          test -s docs/versioning.md
          test -s design/design.md
          test -s .gitmodules

          git config -f .gitmodules --get-regexp '^submodule\..*\.path$'
